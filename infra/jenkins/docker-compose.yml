name: equipgo-jenkins

services:
  jenkins:
    build: .
    container_name: jenkins
    user: root              # classroom/lab only: lets Jenkins use the Docker socket
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "8081:8080"         # Jenkins UI: http://localhost:8081
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_home: